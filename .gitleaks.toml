title = "EasySplat secret scanning"

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Pinned public tokenizer license provenance"
condition = "AND"
regexTarget = "secret"
regexes = [
  '''^f383101a26663708484cac0727792aad74f78234$''',
  '''^c71d239df91726fc519c6eb72d318ec65820627232b2f796219e87dcf35d0ab4$''',
]
paths = ['''^scripts/toolchain/build_da3_mps\.sh$''']

[[rules.allowlists]]
description = "Swift coding key mistaken for a generic API key"
condition = "AND"
regexTarget = "line"
regexes = ['''^[[:space:]]*forKey: \.alignmentP90ResidualDegrees[[:space:]]*$''']
paths = ['''^Tools/BenchmarkDriver/Sources/BenchmarkDriverCore/OrientationEvidenceExtractor\.swift$''']

[[rules.allowlists]]
description = "Frozen native vocabulary output digest"
condition = "AND"
regexTarget = "line"
regexes = ['''^[[:space:]]*"mixed_keypoints": "7bded7db318146a967b8476cb1d0b2fddf3e0c43d8f4aad05a2e951b5201e2d3",[[:space:]]*$''']
paths = ['''^scripts/toolchain/tests/test_native_colmap_retriever\.py$''']
