name: Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-and-shell-lint:
    name: Actions and shell lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install pinned linters
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          GOBIN="$RUNNER_TEMP/bin" go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Run actionlint
        run: actionlint -shellcheck shellcheck
      - name: Run ShellCheck
        run: git ls-files -z 'scripts/*.sh' 'scripts/**/*.sh' | xargs -0 -r shellcheck --severity=warning

  python-vulnerability-audit:
    name: Python dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            Tools/Da3Sfm/requirements.txt
            scripts/benchmark/requirements.txt
            scripts/benchmark/render-requirements.txt
      - name: Audit pinned Python dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input pip-audit==2.10.1
          python -m pip_audit \
            --requirement Tools/Da3Sfm/requirements.txt \
            --progress-spinner off \
            --desc \
            --no-deps \
            --disable-pip
          python -m pip_audit \
            --requirement scripts/benchmark/requirements.txt \
            --progress-spinner off \
            --desc \
            --no-deps \
            --disable-pip
          python -m pip_audit \
            --requirement scripts/benchmark/render-requirements.txt \
            --progress-spinner off \
            --desc \
            --no-deps \
            --disable-pip

  secret-history:
    name: Full-history secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks"
      - name: Scan reachable Git history
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts="--all --full-history" .

  dependency-review:
    name: Pull request dependency review
    if: ${{ github.event_name == 'pull_request' && !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
