          TOOLCHAIN_ROOT: ${{ vars.EASYSPLAT_BENCHMARK_CONSTRAINED_TOOLCHAIN_ROOT }}
          BASELINE_TOOLCHAIN_ROOT: ${{ vars.EASYSPLAT_BENCHMARK_BASELINE_TOOLCHAIN_ROOT }}
          MEASUREMENT_RUNNER: ${{ vars.EASYSPLAT_BENCHMARK_CONSTRAINED_RUNNER }}
          EVIDENCE_KEY_BASE64: ${{ secrets.BENCHMARK_EVIDENCE_KEY_BASE64 }}
        run: |
          test -n "$RELEASE_CORPUS" && test -f "$RELEASE_CORPUS"
          test -n "$TOOLCHAIN_ROOT" && test -d "$TOOLCHAIN_ROOT"
          test -n "$BASELINE_TOOLCHAIN_ROOT" && test -d "$BASELINE_TOOLCHAIN_ROOT"
          test -n "$MEASUREMENT_RUNNER" && test -x "$MEASUREMENT_RUNNER" && test ! -L "$MEASUREMENT_RUNNER"
          test -n "$EVIDENCE_KEY_BASE64"
          umask 077
          BASELINE_CHECKOUT="$RUNNER_TEMP/baseline-checkout"
          rm -rf "$BASELINE_CHECKOUT"
          BASELINE_COMMIT="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["baseline_git_commit"])' "$RUNNER_TEMP/requests/index.json")"
          git worktree add --detach "$BASELINE_CHECKOUT" "$BASELINE_COMMIT"
          cleanup() {
            rm -f "$RUNNER_TEMP/evidence.key"
            git worktree remove --force "$BASELINE_CHECKOUT" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          chmod 0755 "$RUNNER_TEMP/renderer-package/closure/EasySplatBenchmarkDriver"
          python3 scripts/benchmark/renderer_closure.py verify \
            --closure "$RUNNER_TEMP/renderer-package/closure" \
            --identity "$RUNNER_TEMP/renderer-package/identity.json"
          python3 - "$RUNNER_TEMP/evidence.key" <<'PY'
          import base64, os, pathlib, sys
          pathlib.Path(sys.argv[1]).write_bytes(base64.b64decode(os.environ["EVIDENCE_KEY_BASE64"], validate=True))
          PY
          unset EVIDENCE_KEY_BASE64
          python3 scripts/benchmark/run_lane.py \
            --index "$RUNNER_TEMP/requests/index.json" \
            --requests-root "$RUNNER_TEMP/requests" \
            --corpus "$RELEASE_CORPUS" \
            --reference-config scripts/benchmark/reference-config.json \
            --toolchain-root "$TOOLCHAIN_ROOT" \
            --baseline-checkout-root "$BASELINE_CHECKOUT" \
            --baseline-toolchain-root "$BASELINE_TOOLCHAIN_ROOT" \
            --output "$RUNNER_TEMP/constrained-evidence" \
            --lane constrained_14_16gb \
            --runner "$MEASUREMENT_RUNNER" \
            --rendering-driver-closure "$RUNNER_TEMP/renderer-package/closure" \
            --evidence-key-file "$RUNNER_TEMP/evidence.key"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: easysplat-benchmark-constrained-${{ github.sha }}
          path: ${{ runner.temp }}/constrained-evidence
          if-no-files-found: error
          retention-days: 30

  eight-gb:
    needs: prepare
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, macOS, ARM64, easysplat-benchmark-8gb]
    environment: benchmark-release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/benchmark/requirements.txt
      - name: Install protected benchmark dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            --require-hashes \
            --requirement scripts/benchmark/requirements.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: easysplat-benchmark-requests-${{ github.sha }}
          path: ${{ runner.temp }}/requests
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: easysplat-benchmark-renderer-${{ github.sha }}
          path: ${{ runner.temp }}/renderer-package
      - name: Measure and attest physical 8 GB lane
        env:
          RELEASE_CORPUS: ${{ vars.EASYSPLAT_BENCHMARK_8GB_CORPUS }}
          TOOLCHAIN_ROOT: ${{ vars.EASYSPLAT_BENCHMARK_8GB_TOOLCHAIN_ROOT }}
          BASELINE_TOOLCHAIN_ROOT: ${{ vars.EASYSPLAT_BENCHMARK_BASELINE_TOOLCHAIN_ROOT }}
          MEASUREMENT_RUNNER: ${{ vars.EASYSPLAT_BENCHMARK_8GB_RUNNER }}
          EVIDENCE_KEY_BASE64: ${{ secrets.BENCHMARK_EVIDENCE_KEY_BASE64 }}
        run: |
          test -n "$RELEASE_CORPUS" && test -f "$RELEASE_CORPUS"
          test -n "$TOOLCHAIN_ROOT" && test -d "$TOOLCHAIN_ROOT"
          test -n "$BASELINE_TOOLCHAIN_ROOT" && test -d "$BASELINE_TOOLCHAIN_ROOT"
          test -n "$MEASUREMENT_RUNNER" && test -x "$MEASUREMENT_RUNNER" && test ! -L "$MEASUREMENT_RUNNER"
          test -n "$EVIDENCE_KEY_BASE64"
          umask 077
          BASELINE_CHECKOUT="$RUNNER_TEMP/baseline-checkout"
          rm -rf "$BASELINE_CHECKOUT"
          BASELINE_COMMIT="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["baseline_git_commit"])' "$RUNNER_TEMP/requests/index.json")"
          git worktree add --detach "$BASELINE_CHECKOUT" "$BASELINE_COMMIT"
          cleanup() {
            rm -f "$RUNNER_TEMP/evidence.key"
            git worktree remove --force "$BASELINE_CHECKOUT" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          chmod 0755 "$RUNNER_TEMP/renderer-package/closure/EasySplatBenchmarkDriver"
          python3 scripts/benchmark/renderer_closure.py verify \
            --closure "$RUNNER_TEMP/renderer-package/closure" \
            --identity "$RUNNER_TEMP/renderer-package/identity.json"
          python3 - "$RUNNER_TEMP/evidence.key" <<'PY'
          import base64, os, pathlib, sys
          pathlib.Path(sys.argv[1]).write_bytes(base64.b64decode(os.environ["EVIDENCE_KEY_BASE64"], validate=True))
          PY
          unset EVIDENCE_KEY_BASE64
          python3 scripts/benchmark/run_lane.py \
            --index "$RUNNER_TEMP/requests/index.json" \
            --requests-root "$RUNNER_TEMP/requests" \
            --corpus "$RELEASE_CORPUS" \
            --reference-config scripts/benchmark/reference-config.json \
            --toolchain-root "$TOOLCHAIN_ROOT" \
            --baseline-checkout-root "$BASELINE_CHECKOUT" \
            --baseline-toolchain-root "$BASELINE_TOOLCHAIN_ROOT" \
            --output "$RUNNER_TEMP/eight-gb-evidence" \
            --lane eight_gb_fast \
            --runner "$MEASUREMENT_RUNNER" \
