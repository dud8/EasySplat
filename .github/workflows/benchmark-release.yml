            --binary "$RUNNER_TEMP/measurement-adapters/PipelineMeasurementAdapter-current" \
            --binary "$RUNNER_TEMP/measurement-adapters/PipelineMeasurementAdapter-baseline" \
            --binary "$RUNNER_TEMP/measurement-adapters/AccurateReferenceMeasurementAdapter"
          python3 scripts/benchmark/measurement_runner_closure.py build \
