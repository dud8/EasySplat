            --requirement scripts/benchmark/requirements.txt
      - name: Verify bound request and renderer artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTS_ID: ${{ needs.prepare.outputs.requests_artifact_id }}
          REQUESTS_DIGEST: ${{ needs.prepare.outputs.requests_artifact_digest }}
          RENDERER_ID: ${{ needs.prepare.outputs.renderer_artifact_id }}
          RENDERER_DIGEST: ${{ needs.prepare.outputs.renderer_artifact_digest }}
        run: |
          for pair in "$REQUESTS_ID:$REQUESTS_DIGEST" "$RENDERER_ID:$RENDERER_DIGEST"; do
            artifact_id="${pair%%:*}"
            expected_digest="${pair#*:}"
            actual_digest="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" --jq .digest)"
            test -n "$artifact_id" && test "$actual_digest" = "$expected_digest"
          done
      - name: Download bound requests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.requests_artifact_id }}
          path: ${{ runner.temp }}/requests
      - name: Download bound renderer closure
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.renderer_artifact_id }}
          path: ${{ runner.temp }}/renderer-package
      - name: Collect constrained measurements
        env:
          RELEASE_CORPUS: ${{ vars.EASYSPLAT_BENCHMARK_CONSTRAINED_CORPUS }}
          TOOLCHAIN_ROOT: ${{ vars.EASYSPLAT_BENCHMARK_CONSTRAINED_TOOLCHAIN_ROOT }}
          BASELINE_TOOLCHAIN_ROOT: ${{ vars.EASYSPLAT_BENCHMARK_BASELINE_TOOLCHAIN_ROOT }}
          MEASUREMENT_RUNNER: ${{ vars.EASYSPLAT_BENCHMARK_CONSTRAINED_RUNNER }}
        run: |
          test -n "$RELEASE_CORPUS" && test -f "$RELEASE_CORPUS"
          test -n "$TOOLCHAIN_ROOT" && test -d "$TOOLCHAIN_ROOT"
          test -n "$BASELINE_TOOLCHAIN_ROOT" && test -d "$BASELINE_TOOLCHAIN_ROOT"
          test -n "$MEASUREMENT_RUNNER" && test -x "$MEASUREMENT_RUNNER" && test ! -L "$MEASUREMENT_RUNNER"
          BASELINE_CHECKOUT="$RUNNER_TEMP/baseline-checkout"
          rm -rf "$BASELINE_CHECKOUT"
          BASELINE_COMMIT="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["baseline_git_commit"])' "$RUNNER_TEMP/requests/index.json")"
          git worktree add --detach "$BASELINE_CHECKOUT" "$BASELINE_COMMIT"
          cleanup() {
            git worktree remove --force "$BASELINE_CHECKOUT" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          chmod 0755 "$RUNNER_TEMP/renderer-package/closure/EasySplatBenchmarkDriver"
          python3 scripts/benchmark/renderer_closure.py verify \
            --closure "$RUNNER_TEMP/renderer-package/closure" \
            --identity "$RUNNER_TEMP/renderer-package/identity.json"
          python3 scripts/benchmark/run_lane.py \
            --index "$RUNNER_TEMP/requests/index.json" \
            --requests-root "$RUNNER_TEMP/requests" \
            --corpus "$RELEASE_CORPUS" \
            --reference-config scripts/benchmark/reference-config.json \
            --toolchain-root "$TOOLCHAIN_ROOT" \
            --baseline-checkout-root "$BASELINE_CHECKOUT" \
            --baseline-toolchain-root "$BASELINE_TOOLCHAIN_ROOT" \
            --output "$RUNNER_TEMP/constrained-evidence" \
            --lane constrained_14_16gb \
            --runner "$MEASUREMENT_RUNNER" \
            --rendering-driver-closure "$RUNNER_TEMP/renderer-package/closure"
      - name: Upload raw constrained measurements
        id: upload-raw
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: easysplat-benchmark-constrained-raw-${{ github.sha }}
          path: ${{ runner.temp }}/constrained-evidence
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  eight-gb:
    needs: prepare
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, macOS, ARM64, easysplat-benchmark-8gb, easysplat-ephemeral]
    environment: benchmark-release
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    timeout-minutes: 1440
    outputs:
      raw_artifact_id: ${{ steps.upload-raw.outputs.artifact-id }}
      raw_artifact_digest: ${{ format('sha256:{0}', steps.upload-raw.outputs.artifact-digest) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify Xcode 16.4
        run: |
          test -d "$DEVELOPER_DIR"
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 16.4"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/benchmark/requirements.txt
      - name: Install protected benchmark dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            --require-hashes \
            --requirement scripts/benchmark/requirements.txt
      - name: Verify bound request and renderer artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTS_ID: ${{ needs.prepare.outputs.requests_artifact_id }}
          REQUESTS_DIGEST: ${{ needs.prepare.outputs.requests_artifact_digest }}
          RENDERER_ID: ${{ needs.prepare.outputs.renderer_artifact_id }}
          RENDERER_DIGEST: ${{ needs.prepare.outputs.renderer_artifact_digest }}
        run: |
          for pair in "$REQUESTS_ID:$REQUESTS_DIGEST" "$RENDERER_ID:$RENDERER_DIGEST"; do
            artifact_id="${pair%%:*}"
            expected_digest="${pair#*:}"
            actual_digest="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" --jq .digest)"
            test -n "$artifact_id" && test "$actual_digest" = "$expected_digest"
          done
      - name: Download bound requests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.requests_artifact_id }}
          path: ${{ runner.temp }}/requests
      - name: Download bound renderer closure
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.renderer_artifact_id }}
          path: ${{ runner.temp }}/renderer-package
      - name: Collect physical 8 GB measurements
        env:
          RELEASE_CORPUS: ${{ vars.EASYSPLAT_BENCHMARK_8GB_CORPUS }}
          TOOLCHAIN_ROOT: ${{ vars.EASYSPLAT_BENCHMARK_8GB_TOOLCHAIN_ROOT }}
          BASELINE_TOOLCHAIN_ROOT: ${{ vars.EASYSPLAT_BENCHMARK_BASELINE_TOOLCHAIN_ROOT }}
          MEASUREMENT_RUNNER: ${{ vars.EASYSPLAT_BENCHMARK_8GB_RUNNER }}
        run: |
          test -n "$RELEASE_CORPUS" && test -f "$RELEASE_CORPUS"
          test -n "$TOOLCHAIN_ROOT" && test -d "$TOOLCHAIN_ROOT"
          test -n "$BASELINE_TOOLCHAIN_ROOT" && test -d "$BASELINE_TOOLCHAIN_ROOT"
          test -n "$MEASUREMENT_RUNNER" && test -x "$MEASUREMENT_RUNNER" && test ! -L "$MEASUREMENT_RUNNER"
          BASELINE_CHECKOUT="$RUNNER_TEMP/baseline-checkout"
          rm -rf "$BASELINE_CHECKOUT"
          BASELINE_COMMIT="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["baseline_git_commit"])' "$RUNNER_TEMP/requests/index.json")"
          git worktree add --detach "$BASELINE_CHECKOUT" "$BASELINE_COMMIT"
          cleanup() {
            git worktree remove --force "$BASELINE_CHECKOUT" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          chmod 0755 "$RUNNER_TEMP/renderer-package/closure/EasySplatBenchmarkDriver"
          python3 scripts/benchmark/renderer_closure.py verify \
            --closure "$RUNNER_TEMP/renderer-package/closure" \
