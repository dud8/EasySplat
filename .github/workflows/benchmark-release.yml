    runs-on: [self-hosted, macOS, ARM64, easysplat-benchmark-reference, easysplat-ephemeral]
    environment: benchmark-release
    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
    timeout-minutes: 1440
    outputs:
      raw_artifact_id: ${{ steps.upload-raw.outputs.artifact-id }}
      raw_artifact_digest: ${{ format('sha256:{0}', steps.upload-raw.outputs.artifact-digest) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Download verified signed toolchain archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.signed_toolchain_artifact_id }}
          path: ${{ runner.temp }}/signed-toolchain-closure
          merge-multiple: true
      - name: Install verified signed toolchain
        run: |
          python3 scripts/release/toolchain_publication.py install \
            --producer "$RUNNER_TEMP/signed-toolchain-closure/producer" \
            --manifest "$RUNNER_TEMP/signed-toolchain-closure/manifest.json" \
            --public-key "EasySplatApp/Resources/public_key_ed25519.txt" \
            --version "${{ inputs.version }}" \
            --app-version "${{ inputs.app_version }}" \
            --source-repository "$GITHUB_REPOSITORY" \
            --install-root "$RUNNER_TEMP/signed-toolchain-root"
      - name: Verify shipping host
        run: ./scripts/benchmark/verify_shipping_host.sh
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/benchmark/requirements.txt
      - name: Install protected benchmark dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            --require-hashes \
            --requirement scripts/benchmark/requirements.txt
      - name: Download bound requests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.requests_artifact_id }}
          path: ${{ runner.temp }}/requests
      - name: Download bound renderer closure
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.renderer_artifact_id }}
          path: ${{ runner.temp }}/renderer-package
      - name: Download bound measurement runner closure
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.measurement_runner_artifact_id }}
          path: ${{ runner.temp }}/measurement-runner
          digest-mismatch: error
      - name: Validate prepared measurement runner digest binding
        env:
          MEASUREMENT_RUNNER_ARTIFACT_DIGEST: ${{ needs.prepare.outputs.measurement_runner_artifact_digest }}
        run: |
          grep -Eq '^sha256:[0-9a-f]{64}$' <<<"$MEASUREMENT_RUNNER_ARTIFACT_DIGEST"
          test "$MEASUREMENT_RUNNER_ARTIFACT_DIGEST" != "sha256:$(printf '0%.0s' {1..64})"
      - name: Collect reference measurements
        env:
          RELEASE_CORPUS: ${{ vars.EASYSPLAT_BENCHMARK_REFERENCE_CORPUS }}
          BASELINE_TOOLCHAIN_ROOT: ${{ vars.EASYSPLAT_BENCHMARK_BASELINE_TOOLCHAIN_ROOT }}
        run: |
          test -n "$RELEASE_CORPUS" && test -f "$RELEASE_CORPUS"
          TOOLCHAIN_ROOT="$RUNNER_TEMP/signed-toolchain-root"
          test -d "$TOOLCHAIN_ROOT"
          test -n "$BASELINE_TOOLCHAIN_ROOT" && test -d "$BASELINE_TOOLCHAIN_ROOT"
          BASELINE_CHECKOUT="$RUNNER_TEMP/baseline-checkout"
          rm -rf "$BASELINE_CHECKOUT"
          BASELINE_COMMIT="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["baseline_git_commit"])' "$RUNNER_TEMP/requests/index.json")"
          git worktree add --detach "$BASELINE_CHECKOUT" "$BASELINE_COMMIT"
          cleanup() {
            git worktree remove --force "$BASELINE_CHECKOUT" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          chmod 0755 "$RUNNER_TEMP/renderer-package/closure/EasySplatBenchmarkDriver"
          python3 scripts/benchmark/renderer_closure.py verify \
            --closure "$RUNNER_TEMP/renderer-package/closure" \
            --identity "$RUNNER_TEMP/renderer-package/identity.json"
          chmod 0755 "$RUNNER_TEMP/measurement-runner/closure/EasySplatMeasurementRunner"
          python3 scripts/benchmark/measurement_runner_closure.py verify \
            --closure "$RUNNER_TEMP/measurement-runner/closure" \
            --identity "$RUNNER_TEMP/measurement-runner/identity.json"
          python3 scripts/benchmark/run_lane.py \
            --index "$RUNNER_TEMP/requests/index.json" \
            --requests-root "$RUNNER_TEMP/requests" \
            --corpus "$RELEASE_CORPUS" \
            --reference-config scripts/benchmark/reference-config.json \
            --toolchain-root "$TOOLCHAIN_ROOT" \
            --baseline-checkout-root "$BASELINE_CHECKOUT" \
            --baseline-toolchain-root "$BASELINE_TOOLCHAIN_ROOT" \
            --output "$RUNNER_TEMP/reference-evidence" \
            --lane reference_m4_max \
            --runner "$RUNNER_TEMP/measurement-runner/closure/EasySplatMeasurementRunner" \
            --rendering-driver-closure "$RUNNER_TEMP/renderer-package/closure"
      - name: Upload raw reference measurements
        id: upload-raw
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
