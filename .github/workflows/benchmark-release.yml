  derive-reference:
    needs: [prepare, reference]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: macos-15
    timeout-minutes: 240
    outputs:
      prepared_artifact_id: ${{ steps.upload-prepared.outputs.artifact-id }}
      prepared_artifact_digest: ${{ format('sha256:{0}', steps.upload-prepared.outputs.artifact-digest) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            scripts/benchmark/requirements.txt
            scripts/benchmark/render-requirements.txt
      - name: Install protected benchmark dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            --require-hashes \
            --requirement scripts/benchmark/requirements.txt
      - name: Install protected render-scoring dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            --require-hashes \
            --requirement scripts/benchmark/render-requirements.txt
      - name: Verify bound request, renderer, and raw artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTS_ID: ${{ needs.prepare.outputs.requests_artifact_id }}
          REQUESTS_DIGEST: ${{ needs.prepare.outputs.requests_artifact_digest }}
          RENDERER_ID: ${{ needs.prepare.outputs.renderer_artifact_id }}
          RENDERER_DIGEST: ${{ needs.prepare.outputs.renderer_artifact_digest }}
          RAW_ID: ${{ needs.reference.outputs.raw_artifact_id }}
          RAW_DIGEST: ${{ needs.reference.outputs.raw_artifact_digest }}
        run: |
          for pair in \
            "$REQUESTS_ID:$REQUESTS_DIGEST" \
            "$RENDERER_ID:$RENDERER_DIGEST" \
            "$RAW_ID:$RAW_DIGEST"; do
            artifact_id="${pair%%:*}"
            expected_digest="${pair#*:}"
            actual_digest="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" --jq .digest)"
            test -n "$artifact_id" && test "$actual_digest" = "$expected_digest"
          done
      - name: Download bound requests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.requests_artifact_id }}
          path: ${{ runner.temp }}/requests
      - name: Download bound renderer package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.renderer_artifact_id }}
          path: ${{ runner.temp }}/renderer-package
      - name: Download raw reference measurements
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.reference.outputs.raw_artifact_id }}
          path: ${{ runner.temp }}/raw-reference
      - name: Derive compact reference evidence
        env:
          EASYSPLAT_BENCHMARK_LPIPS_BACKBONE: ${{ runner.temp }}/renderer-package/scoring/squeezenet1_1-b8a52dc0.pth
        run: |
          test -f "$EASYSPLAT_BENCHMARK_LPIPS_BACKBONE" && test ! -L "$EASYSPLAT_BENCHMARK_LPIPS_BACKBONE"
          test "$(shasum -a 256 "$EASYSPLAT_BENCHMARK_LPIPS_BACKBONE" | awk '{print $1}')" = "b8a52dc049b60e4b6ab68ad0df457362afab8b6304b2febdc1650a5dab4d7e7b"
          python3 scripts/benchmark/prepare_evidence.py \
            --index "$RUNNER_TEMP/requests/index.json" \
            --requests-root "$RUNNER_TEMP/requests" \
            --raw-evidence-root "$RUNNER_TEMP/raw-reference" \
            --output-root "$RUNNER_TEMP/prepared-reference" \
            --lane reference_m4_max
      - name: Upload compact reference evidence
        id: upload-prepared
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: easysplat-benchmark-reference-prepared-${{ github.sha }}
          path: ${{ runner.temp }}/prepared-reference
          if-no-files-found: error
          retention-days: 7

  derive-constrained:
    needs: [prepare, constrained]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      prepared_artifact_id: ${{ steps.upload-prepared.outputs.artifact-id }}
      prepared_artifact_digest: ${{ format('sha256:{0}', steps.upload-prepared.outputs.artifact-digest) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/benchmark/requirements.txt
      - name: Install protected benchmark dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            --require-hashes \
            --requirement scripts/benchmark/requirements.txt
      - name: Verify bound request and raw artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTS_ID: ${{ needs.prepare.outputs.requests_artifact_id }}
          REQUESTS_DIGEST: ${{ needs.prepare.outputs.requests_artifact_digest }}
          RAW_ID: ${{ needs.constrained.outputs.raw_artifact_id }}
          RAW_DIGEST: ${{ needs.constrained.outputs.raw_artifact_digest }}
        run: |
          for pair in "$REQUESTS_ID:$REQUESTS_DIGEST" "$RAW_ID:$RAW_DIGEST"; do
            artifact_id="${pair%%:*}"
            expected_digest="${pair#*:}"
            actual_digest="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" --jq .digest)"
            test -n "$artifact_id" && test "$actual_digest" = "$expected_digest"
          done
      - name: Download bound requests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.requests_artifact_id }}
          path: ${{ runner.temp }}/requests
      - name: Download raw constrained measurements
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.constrained.outputs.raw_artifact_id }}
          path: ${{ runner.temp }}/raw-constrained
      - name: Derive compact constrained evidence
        run: |
          python3 scripts/benchmark/prepare_evidence.py \
            --index "$RUNNER_TEMP/requests/index.json" \
            --requests-root "$RUNNER_TEMP/requests" \
            --raw-evidence-root "$RUNNER_TEMP/raw-constrained" \
            --output-root "$RUNNER_TEMP/prepared-constrained" \
            --lane constrained_14_16gb
      - name: Upload compact constrained evidence
        id: upload-prepared
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: easysplat-benchmark-constrained-prepared-${{ github.sha }}
          path: ${{ runner.temp }}/prepared-constrained
          if-no-files-found: error
          retention-days: 7

  derive-eight-gb:
    needs: [prepare, eight-gb]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      prepared_artifact_id: ${{ steps.upload-prepared.outputs.artifact-id }}
      prepared_artifact_digest: ${{ format('sha256:{0}', steps.upload-prepared.outputs.artifact-digest) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/benchmark/requirements.txt
      - name: Install protected benchmark dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            --require-hashes \
            --requirement scripts/benchmark/requirements.txt
      - name: Verify bound request and raw artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTS_ID: ${{ needs.prepare.outputs.requests_artifact_id }}
          REQUESTS_DIGEST: ${{ needs.prepare.outputs.requests_artifact_digest }}
          RAW_ID: ${{ needs.eight-gb.outputs.raw_artifact_id }}
          RAW_DIGEST: ${{ needs.eight-gb.outputs.raw_artifact_digest }}
        run: |
          for pair in "$REQUESTS_ID:$REQUESTS_DIGEST" "$RAW_ID:$RAW_DIGEST"; do
            artifact_id="${pair%%:*}"
            expected_digest="${pair#*:}"
            actual_digest="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" --jq .digest)"
            test -n "$artifact_id" && test "$actual_digest" = "$expected_digest"
          done
      - name: Download bound requests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.prepare.outputs.requests_artifact_id }}
          path: ${{ runner.temp }}/requests
      - name: Download raw physical 8 GB measurements
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.eight-gb.outputs.raw_artifact_id }}
          path: ${{ runner.temp }}/raw-eight-gb
      - name: Derive compact physical 8 GB evidence
        run: |
          python3 scripts/benchmark/prepare_evidence.py \
            --index "$RUNNER_TEMP/requests/index.json" \
            --requests-root "$RUNNER_TEMP/requests" \
            --raw-evidence-root "$RUNNER_TEMP/raw-eight-gb" \
            --output-root "$RUNNER_TEMP/prepared-eight-gb" \
            --lane eight_gb_fast
      - name: Upload compact physical 8 GB evidence
        id: upload-prepared
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: easysplat-benchmark-8gb-prepared-${{ github.sha }}
          path: ${{ runner.temp }}/prepared-eight-gb
          if-no-files-found: error
          retention-days: 7

  aggregate:
    needs: [derive-reference, derive-constrained, derive-eight-gb]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/benchmark/requirements.txt
      - name: Install protected benchmark dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            --require-hashes \
            --requirement scripts/benchmark/requirements.txt
      - name: Verify prepared artifact identities
        env:
          GH_TOKEN: ${{ github.token }}
          REFERENCE_ID: ${{ needs.derive-reference.outputs.prepared_artifact_id }}
          REFERENCE_DIGEST: ${{ needs.derive-reference.outputs.prepared_artifact_digest }}
          CONSTRAINED_ID: ${{ needs.derive-constrained.outputs.prepared_artifact_id }}
          CONSTRAINED_DIGEST: ${{ needs.derive-constrained.outputs.prepared_artifact_digest }}
          EIGHT_GB_ID: ${{ needs.derive-eight-gb.outputs.prepared_artifact_id }}
          EIGHT_GB_DIGEST: ${{ needs.derive-eight-gb.outputs.prepared_artifact_digest }}
        run: |
          for pair in \
            "$REFERENCE_ID:$REFERENCE_DIGEST" \
            "$CONSTRAINED_ID:$CONSTRAINED_DIGEST" \
            "$EIGHT_GB_ID:$EIGHT_GB_DIGEST"; do
            artifact_id="${pair%%:*}"
            expected_digest="${pair#*:}"
            test -n "$artifact_id" && test -n "$expected_digest"
            actual_digest="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id" --jq .digest)"
            test "$actual_digest" = "$expected_digest"
          done
      - name: Download compact reference evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.derive-reference.outputs.prepared_artifact_id }}
          path: ${{ runner.temp }}/prepared-reference
      - name: Download compact constrained evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.derive-constrained.outputs.prepared_artifact_id }}
          path: ${{ runner.temp }}/prepared-constrained
      - name: Download compact physical 8 GB evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.derive-eight-gb.outputs.prepared_artifact_id }}
          path: ${{ runner.temp }}/prepared-eight-gb
      - name: Validate and aggregate prepared benchmark evidence
        run: |
          python3 scripts/benchmark/aggregate_evidence.py \
            --prepared-root "$RUNNER_TEMP/prepared-reference" \
            --prepared-root "$RUNNER_TEMP/prepared-constrained" \
            --prepared-root "$RUNNER_TEMP/prepared-eight-gb" \
            --output "$RUNNER_TEMP/verified-benchmark"
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$RUNNER_TEMP/verified-benchmark/suite.json")" = "passed"
          FINAL="$RUNNER_TEMP/final-benchmark"
          rm -rf "$FINAL"
          mkdir -p "$FINAL"
          cp "$RUNNER_TEMP/verified-benchmark/suite.json" "$FINAL/verified-suite.json"
          mkdir -p "$FINAL/evidence"
          cp -R "$RUNNER_TEMP/prepared-reference" "$FINAL/evidence/reference_m4_max"
          cp -R "$RUNNER_TEMP/prepared-constrained" "$FINAL/evidence/constrained_14_16gb"
          cp -R "$RUNNER_TEMP/prepared-eight-gb" "$FINAL/evidence/eight_gb_fast"
      - name: Upload verified benchmark closure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: easysplat-benchmark-${{ github.sha }}
          path: ${{ runner.temp }}/final-benchmark
          if-no-files-found: error
          retention-days: 90
