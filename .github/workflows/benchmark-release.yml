name: Release Benchmark Evidence

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-benchmark-${{ github.sha }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, macOS, ARM64, easysplat-benchmark-reference]
    environment: benchmark-release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/benchmark/requirements.txt
      - name: Install protected benchmark dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            --require-hashes \
            --requirement scripts/benchmark/requirements.txt

      - name: Verify protected source and prepare bound requests
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RELEASE_CORPUS: ${{ vars.EASYSPLAT_BENCHMARK_REFERENCE_CORPUS }}
          TOOLCHAIN_ROOT: ${{ vars.EASYSPLAT_BENCHMARK_REFERENCE_TOOLCHAIN_ROOT }}
          REFERENCE_RUNNER_SHA256: ${{ vars.EASYSPLAT_BENCHMARK_REFERENCE_RUNNER_SHA256 }}
          CONSTRAINED_RUNNER_SHA256: ${{ vars.EASYSPLAT_BENCHMARK_CONSTRAINED_RUNNER_SHA256 }}
          EIGHT_GB_RUNNER_SHA256: ${{ vars.EASYSPLAT_BENCHMARK_8GB_RUNNER_SHA256 }}
        run: |
          test -n "$RELEASE_CORPUS"
          test -f "$RELEASE_CORPUS"
          test -n "$TOOLCHAIN_ROOT"
          test -d "$TOOLCHAIN_ROOT"
          runner_sha_re='^sha256:[0-9a-f]{64}$'
          for runner_sha in "$REFERENCE_RUNNER_SHA256" "$CONSTRAINED_RUNNER_SHA256" "$EIGHT_GB_RUNNER_SHA256"; do
            if ! [[ "$runner_sha" =~ $runner_sha_re ]]; then
              echo "Each protected benchmark runner needs an approved lowercase sha256:<64 hex> identity." >&2
              exit 1
            fi
          done
          CURRENT_HEAD="$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha)"
          test "$GITHUB_SHA" = "$CURRENT_HEAD"
          test -z "$(git status --porcelain)"
          RENDERER_BUILD="$RUNNER_TEMP/renderer-build"
          RENDERER_PACKAGE="$RUNNER_TEMP/renderer-package"
          rm -rf "$RENDERER_BUILD" "$RENDERER_PACKAGE"
          swift build \
            --configuration release \
            --scratch-path "$RENDERER_BUILD" \
            --product EasySplatBenchmarkDriver
          RENDERER_BIN="$(swift build \
            --configuration release \
            --scratch-path "$RENDERER_BUILD" \
            --show-bin-path)"
          python3 scripts/benchmark/renderer_closure.py build \
            --executable "$RENDERER_BIN/EasySplatBenchmarkDriver" \
            --resource-bundle "$RENDERER_BIN/MetalSplatter_MetalSplatter.bundle" \
            --output "$RENDERER_PACKAGE/closure" \
            --identity-output "$RENDERER_PACKAGE/identity.json"
          test -z "$(git status --porcelain)"
          REQUESTS="$RUNNER_TEMP/easysplat-benchmark-requests"
          rm -rf "$REQUESTS"
          scripts/benchmark/run_suite.sh \
            --profile release \
            --corpus "$RELEASE_CORPUS" \
            --toolchain-root "$TOOLCHAIN_ROOT" \
            --output "$RUNNER_TEMP/unused-benchmark-output" \
            --runner-identity "reference_m4_max=$REFERENCE_RUNNER_SHA256" \
            --runner-identity "constrained_14_16gb=$CONSTRAINED_RUNNER_SHA256" \
            --runner-identity "eight_gb_fast=$EIGHT_GB_RUNNER_SHA256" \
            --rendering-driver-identity "$RENDERER_PACKAGE/identity.json" \
            --emit-requests "$REQUESTS"

      - name: Upload bound requests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: easysplat-benchmark-requests-${{ github.sha }}
          path: ${{ runner.temp }}/easysplat-benchmark-requests
          if-no-files-found: error
          retention-days: 7

      - name: Upload bound renderer closure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: easysplat-benchmark-renderer-${{ github.sha }}
          path: ${{ runner.temp }}/renderer-package
          if-no-files-found: error
          retention-days: 7

  reference:
    needs: prepare
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, macOS, ARM64, easysplat-benchmark-reference]
    environment: benchmark-release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            scripts/benchmark/requirements.txt
            scripts/benchmark/render-requirements.txt
      - name: Install protected benchmark dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            --require-hashes \
            --requirement scripts/benchmark/requirements.txt
      - name: Install protected render-scoring dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            --require-hashes \
            --requirement scripts/benchmark/render-requirements.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: easysplat-benchmark-requests-${{ github.sha }}
          path: ${{ runner.temp }}/requests
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: easysplat-benchmark-renderer-${{ github.sha }}
          path: ${{ runner.temp }}/renderer-package
      - name: Measure and attest reference lane
        env:
          RELEASE_CORPUS: ${{ vars.EASYSPLAT_BENCHMARK_REFERENCE_CORPUS }}
          TOOLCHAIN_ROOT: ${{ vars.EASYSPLAT_BENCHMARK_REFERENCE_TOOLCHAIN_ROOT }}
          BASELINE_TOOLCHAIN_ROOT: ${{ vars.EASYSPLAT_BENCHMARK_BASELINE_TOOLCHAIN_ROOT }}
          MEASUREMENT_RUNNER: ${{ vars.EASYSPLAT_BENCHMARK_REFERENCE_RUNNER }}
          EASYSPLAT_BENCHMARK_LPIPS_BACKBONE: ${{ vars.EASYSPLAT_BENCHMARK_LPIPS_BACKBONE }}
          EVIDENCE_KEY_BASE64: ${{ secrets.BENCHMARK_EVIDENCE_KEY_BASE64 }}
        run: |
          test -n "$RELEASE_CORPUS" && test -f "$RELEASE_CORPUS"
          test -n "$TOOLCHAIN_ROOT" && test -d "$TOOLCHAIN_ROOT"
          test -n "$BASELINE_TOOLCHAIN_ROOT" && test -d "$BASELINE_TOOLCHAIN_ROOT"
          test -n "$MEASUREMENT_RUNNER" && test -x "$MEASUREMENT_RUNNER" && test ! -L "$MEASUREMENT_RUNNER"
          test -n "$EASYSPLAT_BENCHMARK_LPIPS_BACKBONE"
          test -f "$EASYSPLAT_BENCHMARK_LPIPS_BACKBONE" && test ! -L "$EASYSPLAT_BENCHMARK_LPIPS_BACKBONE"
          test "$(shasum -a 256 "$EASYSPLAT_BENCHMARK_LPIPS_BACKBONE" | awk '{print $1}')" = "b8a52dc049b60e4b6ab68ad0df457362afab8b6304b2febdc1650a5dab4d7e7b"
          test -n "$EVIDENCE_KEY_BASE64"
          umask 077
          BASELINE_CHECKOUT="$RUNNER_TEMP/baseline-checkout"
          rm -rf "$BASELINE_CHECKOUT"
          BASELINE_COMMIT="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["baseline_git_commit"])' "$RUNNER_TEMP/requests/index.json")"
          git worktree add --detach "$BASELINE_CHECKOUT" "$BASELINE_COMMIT"
          cleanup() {
            rm -f "$RUNNER_TEMP/evidence.key"
            git worktree remove --force "$BASELINE_CHECKOUT" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          chmod 0755 "$RUNNER_TEMP/renderer-package/closure/EasySplatBenchmarkDriver"
          python3 scripts/benchmark/renderer_closure.py verify \
            --closure "$RUNNER_TEMP/renderer-package/closure" \
            --identity "$RUNNER_TEMP/renderer-package/identity.json"
          python3 - "$RUNNER_TEMP/evidence.key" <<'PY'
          import base64, os, pathlib, sys
          pathlib.Path(sys.argv[1]).write_bytes(base64.b64decode(os.environ["EVIDENCE_KEY_BASE64"], validate=True))
          PY
          unset EVIDENCE_KEY_BASE64
          python3 scripts/benchmark/run_lane.py \
            --index "$RUNNER_TEMP/requests/index.json" \
            --requests-root "$RUNNER_TEMP/requests" \
            --corpus "$RELEASE_CORPUS" \
            --reference-config scripts/benchmark/reference-config.json \
            --toolchain-root "$TOOLCHAIN_ROOT" \
            --baseline-checkout-root "$BASELINE_CHECKOUT" \
            --baseline-toolchain-root "$BASELINE_TOOLCHAIN_ROOT" \
            --output "$RUNNER_TEMP/reference-evidence" \
            --lane reference_m4_max \
            --runner "$MEASUREMENT_RUNNER" \
            --rendering-driver-closure "$RUNNER_TEMP/renderer-package/closure" \
            --evidence-key-file "$RUNNER_TEMP/evidence.key"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: easysplat-benchmark-reference-${{ github.sha }}
          path: ${{ runner.temp }}/reference-evidence
          if-no-files-found: error
          retention-days: 30

  constrained:
    needs: prepare
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, macOS, ARM64, easysplat-benchmark-constrained]
