        with:
          name: easysplat-benchmark-8gb-${{ github.sha }}
          path: ${{ runner.temp }}/eight-gb-evidence
          if-no-files-found: error
          retention-days: 30

  aggregate:
    needs: [prepare, reference, constrained, eight-gb]
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, macOS, ARM64, easysplat-benchmark-reference]
    environment: benchmark-release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            scripts/benchmark/requirements.txt
            scripts/benchmark/render-requirements.txt
      - name: Install protected benchmark dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            --require-hashes \
            --requirement scripts/benchmark/requirements.txt
      - name: Install protected render-scoring dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            --require-hashes \
            --requirement scripts/benchmark/render-requirements.txt
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: easysplat-benchmark-requests-${{ github.sha }}
          path: ${{ runner.temp }}/requests
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: easysplat-benchmark-reference-${{ github.sha }}
          path: ${{ runner.temp }}/evidence
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: easysplat-benchmark-constrained-${{ github.sha }}
          path: ${{ runner.temp }}/evidence
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: easysplat-benchmark-8gb-${{ github.sha }}
          path: ${{ runner.temp }}/evidence
      - name: Verify and aggregate protected evidence
        env:
          RELEASE_CORPUS: ${{ vars.EASYSPLAT_BENCHMARK_REFERENCE_CORPUS }}
          TOOLCHAIN_ROOT: ${{ vars.EASYSPLAT_BENCHMARK_REFERENCE_TOOLCHAIN_ROOT }}
          EASYSPLAT_BENCHMARK_LPIPS_BACKBONE: ${{ vars.EASYSPLAT_BENCHMARK_LPIPS_BACKBONE }}
          EVIDENCE_KEY_BASE64: ${{ secrets.BENCHMARK_EVIDENCE_KEY_BASE64 }}
        run: |
          test -n "$RELEASE_CORPUS" && test -f "$RELEASE_CORPUS"
          test -n "$TOOLCHAIN_ROOT" && test -d "$TOOLCHAIN_ROOT"
          test -n "$EASYSPLAT_BENCHMARK_LPIPS_BACKBONE"
          test -f "$EASYSPLAT_BENCHMARK_LPIPS_BACKBONE" && test ! -L "$EASYSPLAT_BENCHMARK_LPIPS_BACKBONE"
          test "$(shasum -a 256 "$EASYSPLAT_BENCHMARK_LPIPS_BACKBONE" | awk '{print $1}')" = "b8a52dc049b60e4b6ab68ad0df457362afab8b6304b2febdc1650a5dab4d7e7b"
          test -n "$EVIDENCE_KEY_BASE64"
          umask 077
          trap 'rm -f "$RUNNER_TEMP/evidence.key"' EXIT
          python3 - "$RUNNER_TEMP/evidence.key" <<'PY'
          import base64, os, pathlib, sys
          pathlib.Path(sys.argv[1]).write_bytes(base64.b64decode(os.environ["EVIDENCE_KEY_BASE64"], validate=True))
          PY
          unset EVIDENCE_KEY_BASE64
          OUTPUT="$RUNNER_TEMP/verified-benchmark"
          scripts/benchmark/run_suite.sh \
            --profile release \
            --corpus "$RELEASE_CORPUS" \
            --toolchain-root "$TOOLCHAIN_ROOT" \
            --evidence-root "$RUNNER_TEMP/evidence" \
            --evidence-key-file "$RUNNER_TEMP/evidence.key" \
            --request-index "$RUNNER_TEMP/requests/index.json" \
            --output "$OUTPUT"
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$OUTPUT/suite.json")" = "passed"
          FINAL="$RUNNER_TEMP/final-benchmark"
          rm -rf "$FINAL"
          mkdir -p "$FINAL"
          cp "$OUTPUT/suite.json" "$FINAL/suite.json"
          cp -R "$RUNNER_TEMP/requests" "$FINAL/requests"
          cp -R "$RUNNER_TEMP/evidence" "$FINAL/evidence"
      - name: Upload verified benchmark closure
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: easysplat-benchmark-${{ github.sha }}
          path: ${{ runner.temp }}/final-benchmark
          if-no-files-found: error
          retention-days: 90
