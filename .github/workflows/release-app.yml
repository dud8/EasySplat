name: Release App

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version (semver)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TOOLCHAIN_TAG=toolchain-v$VERSION" >> $GITHUB_ENV

      - name: Write public key
        env:
          TOOLCHAIN_PUBLIC_KEY_BASE64: ${{ secrets.TOOLCHAIN_PUBLIC_KEY_BASE64 }}
        run: |
          if [ -z "$TOOLCHAIN_PUBLIC_KEY_BASE64" ]; then
            echo "Missing TOOLCHAIN_PUBLIC_KEY_BASE64 secret"
            exit 1
          fi
          echo "$TOOLCHAIN_PUBLIC_KEY_BASE64" > "$RUNNER_TEMP/public_key.txt"

      - name: Build app bundle
        run: |
          MANIFEST_URL="https://github.com/${{ github.repository }}/releases/download/${{ env.TOOLCHAIN_TAG }}/manifest.json"
          scripts/release/build_app.sh \
            --manifest-url "$MANIFEST_URL" \
            --public-key-path "$RUNNER_TEMP/public_key.txt" \
            --version "$VERSION"

      - name: Create DMG
        run: |
          scripts/release/create_dmg.sh \
            --app-path "build/Export/EasySplatApp.app" \
            --out "build/EasySplat-$VERSION.dmg"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: |
            build/EasySplat-${{ env.VERSION }}.dmg
