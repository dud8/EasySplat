name: Release App

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version (semver)"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 16
        run: |
          if [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          fi

      - name: Resolve version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          semver_re='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
          else
            case "$REF_NAME" in
              v*) ;;
              *)
                echo "Expected release tag to start with v, got: $REF_NAME" >&2
                exit 1
                ;;
            esac
            VERSION="${REF_NAME#v}"
          fi
          if ! [[ "$VERSION" =~ $semver_re ]]; then
            echo "Invalid semantic version: $VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TOOLCHAIN_TAG=toolchain-v$VERSION" >> "$GITHUB_ENV"

      - name: Write public key
        env:
          TOOLCHAIN_PUBLIC_KEY_BASE64: ${{ secrets.TOOLCHAIN_PUBLIC_KEY_BASE64 }}
        run: |
          if [ -z "$TOOLCHAIN_PUBLIC_KEY_BASE64" ]; then
            echo "Missing TOOLCHAIN_PUBLIC_KEY_BASE64 secret"
            exit 1
          fi
          echo "$TOOLCHAIN_PUBLIC_KEY_BASE64" > "$RUNNER_TEMP/public_key.txt"

      - name: Build app bundle
        env:
          REPOSITORY: ${{ github.repository }}
          TOOLCHAIN_TAG: ${{ env.TOOLCHAIN_TAG }}
        run: |
          MANIFEST_URL="https://github.com/$REPOSITORY/releases/download/$TOOLCHAIN_TAG/manifest.json"
          scripts/release/build_app.sh \
            --manifest-url "$MANIFEST_URL" \
            --public-key-path "$RUNNER_TEMP/public_key.txt" \
            --project-url "https://github.com/$REPOSITORY" \
            --version "$VERSION"

      - name: Create DMG
        run: |
          scripts/release/create_dmg.sh \
            --app-path "build/Export/EasySplat.app" \
            --out "build/EasySplat-$VERSION.dmg"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: |
            build/EasySplat-${{ env.VERSION }}.dmg
