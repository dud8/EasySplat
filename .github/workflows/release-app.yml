name: Release App

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Existing public-beta tag version"
        required: true
        default: "0.2.0-beta.1"
        type: string
      toolchain_version:
        description: "Published toolchain version"
        required: true
        default: "2.0.0"
        type: string
      benchmark_run_id:
        description: "Successful Release Benchmark Evidence workflow run ID"
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: public-beta-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, macOS, ARM64, easysplat-release]
    environment: public-beta-release
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Verify protected source and existing tag
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_TOOLCHAIN_VERSION: ${{ inputs.toolchain_version }}
        run: |
          semver_re='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          VERSION="$INPUT_VERSION"
          TOOLCHAIN_VERSION="$INPUT_TOOLCHAIN_VERSION"
          if ! [[ "$VERSION" =~ $semver_re ]] || [[ "$VERSION" != *-* ]]; then
            echo "App version must be a semantic prerelease: $VERSION" >&2
            exit 1
          fi
          if ! [[ "$TOOLCHAIN_VERSION" =~ $semver_re ]]; then
            echo "Invalid toolchain semantic version: $TOOLCHAIN_VERSION" >&2
            exit 1
          fi
          CURRENT_HEAD="$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha)"
          if [ "$GITHUB_SHA" != "$CURRENT_HEAD" ]; then
            echo "Public beta releases must use the current protected $DEFAULT_BRANCH commit." >&2
            exit 1
          fi
          if [ "$(gh api "repos/$GITHUB_REPOSITORY/immutable-releases" --jq .enabled)" != "true" ]; then
            echo "Enable GitHub Immutable Releases before publishing the public beta." >&2
            exit 1
          fi
          TAG="v$VERSION"
          TAG_COMMIT="$(git rev-parse "$TAG^{commit}" 2>/dev/null || true)"
          if [ "$TAG_COMMIT" != "$GITHUB_SHA" ]; then
            echo "Create $TAG on the reviewed main commit before starting this workflow." >&2
            exit 1
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists and will not be overwritten." >&2
            exit 1
          fi
          {
            echo "VERSION=$VERSION"
            echo "TAG=$TAG"
            echo "TOOLCHAIN_VERSION=$TOOLCHAIN_VERSION"
            echo "TOOLCHAIN_TAG=toolchain-v$TOOLCHAIN_VERSION"
          } >>"$GITHUB_ENV"

      - name: Select Xcode 16.4
        run: |
          test "$(uname -m)" = "arm64"
          test "$(sw_vers -productVersion | cut -d. -f1)" = "15"
          test -d /Applications/Xcode_16.4.app
          sudo xcode-select -s /Applications/Xcode_16.4.app
          test "$(xcodebuild -version | sed -n '1s/^Xcode //p')" = "16.4"

      - name: Fetch signed toolchain closure
        env:
          GH_TOKEN: ${{ github.token }}
          TOOLCHAIN_PUBLIC_KEY_BASE64: ${{ secrets.TOOLCHAIN_PUBLIC_KEY_BASE64 }}
        run: |
          test -n "$TOOLCHAIN_PUBLIC_KEY_BASE64"
          TRACKED_PUBLIC_KEY="$(tr -d '[:space:]' <EasySplatApp/Resources/public_key_ed25519.txt)"
          if [ "$TOOLCHAIN_PUBLIC_KEY_BASE64" != "$TRACKED_PUBLIC_KEY" ]; then
            echo "TOOLCHAIN_PUBLIC_KEY_BASE64 does not match the reviewed app trust root." >&2
            exit 1
          fi
          rm -rf Toolchains/out
          mkdir -p Toolchains/out
          gh release download "$TOOLCHAIN_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir Toolchains/out \
            --pattern manifest.json \
            --pattern "toolchain-macos-arm64-$TOOLCHAIN_VERSION-core.zip" \
            --pattern "toolchain-geometry-da3-base-$TOOLCHAIN_VERSION.zip" \
            --pattern "toolchain-geometry-da3-small-$TOOLCHAIN_VERSION.zip"
          mv Toolchains/out/manifest.json Toolchains/manifest.json
          printf '%s' "$TRACKED_PUBLIC_KEY" >Toolchains/public_key_ed25519.txt
          unset TOOLCHAIN_PUBLIC_KEY_BASE64 TRACKED_PUBLIC_KEY

      - name: Build unsigned public beta
        run: |
          BASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TOOLCHAIN_TAG"
          scripts/release/build_dmg.sh \
            --app-version "$VERSION" \
            --toolchain-version "$TOOLCHAIN_VERSION" \
            --manifest-url "$BASE_URL/manifest.json" \
            --core-artifact-url "$BASE_URL/toolchain-macos-arm64-$TOOLCHAIN_VERSION-core.zip" \
            --da3-base-artifact-url "$BASE_URL/toolchain-geometry-da3-base-$TOOLCHAIN_VERSION.zip" \
            --da3-small-artifact-url "$BASE_URL/toolchain-geometry-da3-small-$TOOLCHAIN_VERSION.zip" \
            --project-url "https://github.com/$GITHUB_REPOSITORY" \
            --use-existing-toolchain \
            --unsigned-beta

      - name: Verify beta artifacts
        env:
          RELEASE_FIXTURE: ${{ vars.EASYSPLAT_RELEASE_FIXTURE }}
        run: |
          test -n "$RELEASE_FIXTURE"
          test -e "$RELEASE_FIXTURE"
          swift build -c release --product EasySplatReleaseVerifier
          CACHE_ROOT="$RUNNER_TEMP/easysplat-release-toolchains"
          rm -rf "$CACHE_ROOT"
          mkdir -p "$CACHE_ROOT"
          BASE_URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$TOOLCHAIN_TAG"
          scripts/release/verify_beta.sh \
            --app build/Export/EasySplat.app \
            --dmg "release/DMG/EasySplat-$VERSION-unsigned.dmg" \
            --expected-version "$VERSION" \
            --artifacts \
            --source-url "https://github.com/$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA" \
            --release-manifest Toolchains/manifest.json \
            --core-archive "Toolchains/out/toolchain-macos-arm64-$TOOLCHAIN_VERSION-core.zip" \
            --da3-base-archive "Toolchains/out/toolchain-geometry-da3-base-$TOOLCHAIN_VERSION.zip" \
            --da3-small-archive "Toolchains/out/toolchain-geometry-da3-small-$TOOLCHAIN_VERSION.zip" \
            --fixture "$RELEASE_FIXTURE" \
            --manifest-url "$BASE_URL/manifest.json" \
            --public-key-file Toolchains/public_key_ed25519.txt \
            --toolchain-root "$CACHE_ROOT" \
            --e2e-runner .build/release/EasySplatReleaseVerifier \
            --offline-cache-root "$CACHE_ROOT" \
            --offline-runner .build/release/EasySplatReleaseVerifier

      - name: Verify packaged app UI
        env:
          EASYSPLAT_ISOLATED_UI_RUNNER: "1"
        run: |
          UI_OUTPUT="$RUNNER_TEMP/easysplat-ui-verification"
          rm -rf "$UI_OUTPUT"
          scripts/release/verify_ui.sh \
            --app "$GITHUB_WORKSPACE/build/Export/EasySplat.app" \
            --output-dir "$UI_OUTPUT"

      - name: Preserve packaged UI evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: easysplat-ui-${{ github.sha }}
          path: ${{ runner.temp }}/easysplat-ui-verification
          if-no-files-found: warn
          retention-days: 30

      - name: Consume and reverify protected benchmark evidence
        env:
          RELEASE_CORPUS: ${{ vars.EASYSPLAT_RELEASE_CORPUS }}
          EVIDENCE_KEY_BASE64: ${{ secrets.BENCHMARK_EVIDENCE_KEY_BASE64 }}
          INPUT_BENCHMARK_RUN_ID: ${{ inputs.benchmark_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test -n "$RELEASE_CORPUS"
          test -f "$RELEASE_CORPUS"
          test -n "$EVIDENCE_KEY_BASE64"
          test -n "$INPUT_BENCHMARK_RUN_ID"
          RUN_API="repos/$GITHUB_REPOSITORY/actions/runs/$INPUT_BENCHMARK_RUN_ID"
          test "$(gh api "$RUN_API" --jq .head_sha)" = "$GITHUB_SHA"
          test "$(gh api "$RUN_API" --jq .event)" = "workflow_dispatch"
          test "$(gh api "$RUN_API" --jq .conclusion)" = "success"
          test "$(gh api "$RUN_API" --jq '.path | split("@")[0]')" = ".github/workflows/benchmark-release.yml"
          BENCHMARK_ARTIFACT="$RUNNER_TEMP/easysplat-benchmark-artifact"
          rm -rf "$BENCHMARK_ARTIFACT"
          mkdir -p "$BENCHMARK_ARTIFACT"
          gh run download "$INPUT_BENCHMARK_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "easysplat-benchmark-$GITHUB_SHA" \
            --dir "$BENCHMARK_ARTIFACT"
          test -f "$BENCHMARK_ARTIFACT/suite.json"
          test -d "$BENCHMARK_ARTIFACT/evidence"
          umask 077
          trap 'rm -f "$RUNNER_TEMP/evidence.key"' EXIT
          python3 - "$RUNNER_TEMP/evidence.key" <<'PY'
          import base64, os, pathlib, sys
          pathlib.Path(sys.argv[1]).write_bytes(base64.b64decode(os.environ["EVIDENCE_KEY_BASE64"], validate=True))
          PY
          unset EVIDENCE_KEY_BASE64
          BENCHMARK_OUTPUT="$RUNNER_TEMP/easysplat-release-benchmark"
          rm -rf "$BENCHMARK_OUTPUT"
          scripts/benchmark/run_suite.sh \
            --profile release \
            --corpus "$RELEASE_CORPUS" \
            --toolchain-root "$RUNNER_TEMP/easysplat-release-toolchains/$TOOLCHAIN_VERSION" \
            --evidence-root "$BENCHMARK_ARTIFACT/evidence" \
            --evidence-key-file "$RUNNER_TEMP/evidence.key" \
            --request-index "$BENCHMARK_ARTIFACT/requests/index.json" \
            --output "$BENCHMARK_OUTPUT"
          python3 - "$BENCHMARK_ARTIFACT/suite.json" "$BENCHMARK_OUTPUT/suite.json" <<'PY'
          import json, os, sys
          recorded = json.load(open(sys.argv[1], encoding="utf-8"))
          verified = json.load(open(sys.argv[2], encoding="utf-8"))
          for field in ("status", "app_version", "toolchain_identity", "thresholds_digest", "corpus_digest", "scene_results", "aggregates"):
              if recorded[field] != verified[field]:
                  raise SystemExit(f"downloaded benchmark field changed during reverification: {field}")
          if (
              verified["status"] != "passed"
              or verified["git"]["commit"] != os.environ["GITHUB_SHA"]
              or verified["app_version"] != os.environ["VERSION"]
          ):
              raise SystemExit("benchmark evidence is not bound to this release commit")
          PY
          cp "$BENCHMARK_OUTPUT/suite.json" \
            "release/DMG/EasySplat-$VERSION-benchmark.json"

      - name: Validate SPDX 2.3 output independently
        run: |
          SPDX_VENV="$RUNNER_TEMP/spdx-tools"
          python3 -m venv "$SPDX_VENV"
          "$SPDX_VENV/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-input \
            --require-hashes \
            --only-binary=:all: \
            --requirement scripts/release/spdx-requirements.txt
          "$SPDX_VENV/bin/pyspdxtools" \
            -i "release/DMG/EasySplat-$VERSION.spdx.json"

      - name: Scan shipped SBOM for actionable vulnerabilities
        env:
          GRYPE_VERSION: 0.115.0
          GRYPE_DARWIN_ARM64_SHA256: a5faa957bca6f39e252a046b9431cd79745030c692dd400ab4c0c74266edc406
          GRYPE_CHECK_FOR_APP_UPDATE: "false"
          GRYPE_DB_REQUIRE_UPDATE_CHECK: "true"
          GRYPE_DB_CACHE_DIR: ${{ runner.temp }}/grype-db
        run: |
          archive="$RUNNER_TEMP/grype-$GRYPE_VERSION.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://github.com/anchore/grype/releases/download/v$GRYPE_VERSION/grype_${GRYPE_VERSION}_darwin_arm64.tar.gz"
          printf '%s  %s\n' "$GRYPE_DARWIN_ARM64_SHA256" "$archive" \
            | shasum -a 256 -c -
          rm -f "$RUNNER_TEMP/grype"
          tar -xzf "$archive" -C "$RUNNER_TEMP" grype
          test "$("$RUNNER_TEMP/grype" version | sed -n 's/^Version:[[:space:]]*//p')" = "$GRYPE_VERSION"
          "$RUNNER_TEMP/grype" --config /dev/null \
            "sbom:release/DMG/EasySplat-$VERSION.spdx.json" \
            --only-fixed \
            --fail-on high

      - name: Record trusted release asset hashes
        run: |
          LOCAL_ASSET_HASHES="$RUNNER_TEMP/app-release-assets.sha256"
          (
            cd release/DMG
            shasum -a 256 \
              "EasySplat-$VERSION-unsigned.dmg" \
              "EasySplat-$VERSION-unsigned.dmg.sha256" \
              "EasySplat-$VERSION.provenance.json" \
              "EasySplat-$VERSION.spdx.json" \
              "EasySplat-$VERSION-licenses.zip" \
              "EasySplat-$VERSION-dSYM.zip" \
              "EasySplat-$VERSION-benchmark.json"
          ) >"$LOCAL_ASSET_HASHES"
          test "$(wc -l <"$LOCAL_ASSET_HASHES" | tr -d '[:space:]')" = "7"

      - name: Create immutable draft prerelease
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ env.TAG }}
          prerelease: true
          draft: true
          overwrite_files: false
          fail_on_unmatched_files: true
          token: ${{ github.token }}
          generate_release_notes: false
          body_path: release/DMG/EasySplat-${{ env.VERSION }}-release-notes.txt
          files: |
            release/DMG/EasySplat-${{ env.VERSION }}-unsigned.dmg
            release/DMG/EasySplat-${{ env.VERSION }}-unsigned.dmg.sha256
            release/DMG/EasySplat-${{ env.VERSION }}.provenance.json
            release/DMG/EasySplat-${{ env.VERSION }}.spdx.json
            release/DMG/EasySplat-${{ env.VERSION }}-licenses.zip
            release/DMG/EasySplat-${{ env.VERSION }}-dSYM.zip
            release/DMG/EasySplat-${{ env.VERSION }}-benchmark.json

      - name: Verify downloaded draft assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REMOTE="$RUNNER_TEMP/app-release-download"
          LOCAL_ASSET_HASHES="$RUNNER_TEMP/app-release-assets.sha256"
          rm -rf "$REMOTE"
          mkdir -p "$REMOTE"
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$REMOTE" \
            --pattern "EasySplat-$VERSION-unsigned.dmg" \
            --pattern "EasySplat-$VERSION-unsigned.dmg.sha256" \
            --pattern "EasySplat-$VERSION.provenance.json" \
            --pattern "EasySplat-$VERSION.spdx.json" \
            --pattern "EasySplat-$VERSION-licenses.zip" \
            --pattern "EasySplat-$VERSION-dSYM.zip" \
            --pattern "EasySplat-$VERSION-benchmark.json"
          test -s "$LOCAL_ASSET_HASHES"
          (cd "$REMOTE" && shasum -a 256 -c "$LOCAL_ASSET_HASHES")
          (cd "$REMOTE" && shasum -a 256 -c "EasySplat-$VERSION-unsigned.dmg.sha256")
          python3 scripts/release/generate_release_metadata.py verify \
            --app-version "$VERSION" \
            --toolchain-version "$TOOLCHAIN_VERSION" \
            --release-mode unsigned-beta \
            --source-url "https://github.com/$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA" \
            --dmg "$REMOTE/EasySplat-$VERSION-unsigned.dmg" \
            --manifest Toolchains/manifest.json \
            --core "Toolchains/out/toolchain-macos-arm64-$TOOLCHAIN_VERSION-core.zip" \
            --da3-base "Toolchains/out/toolchain-geometry-da3-base-$TOOLCHAIN_VERSION.zip" \
            --da3-small "Toolchains/out/toolchain-geometry-da3-small-$TOOLCHAIN_VERSION.zip" \
            --app-license LICENSE \
            --notice NOTICE.md \
            --viewer-license ThirdParty/MetalSplatter/LICENSE \
            --provenance "$REMOTE/EasySplat-$VERSION.provenance.json" \
            --spdx "$REMOTE/EasySplat-$VERSION.spdx.json" \
            --licenses "$REMOTE/EasySplat-$VERSION-licenses.zip"
          "$RUNNER_TEMP/spdx-tools/bin/pyspdxtools" \
            -i "$REMOTE/EasySplat-$VERSION.spdx.json"
          unzip -tq "$REMOTE/EasySplat-$VERSION-dSYM.zip"
          REMOTE_DSYM_ROOT="$RUNNER_TEMP/app-release-dsym"
          rm -rf "$REMOTE_DSYM_ROOT"
          mkdir -p "$REMOTE_DSYM_ROOT"
          ditto -x -k "$REMOTE/EasySplat-$VERSION-dSYM.zip" "$REMOTE_DSYM_ROOT"
          REMOTE_DSYM="$REMOTE_DSYM_ROOT/EasySplat.app.dSYM"
          test -d "$REMOTE_DSYM"
          APP_UUIDS="$(xcrun dwarfdump --uuid \
            build/Export/EasySplat.app/Contents/MacOS/EasySplatApp)"
          DSYM_UUIDS="$(xcrun dwarfdump --uuid "$REMOTE_DSYM")"
          test "$(awk '/^UUID: / { count += 1 } END { print count + 0 }' <<<"$APP_UUIDS")" = "1"
          test "$(awk '/^UUID: / { count += 1 } END { print count + 0 }' <<<"$DSYM_UUIDS")" = "1"
          test "$(awk '/^UUID: / { print $2 " " $3 }' <<<"$APP_UUIDS")" = \
            "$(awk '/^UUID: / { print $2 " " $3 }' <<<"$DSYM_UUIDS")"

      - name: Publish verified prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id)"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false \
            -F prerelease=true >/dev/null
