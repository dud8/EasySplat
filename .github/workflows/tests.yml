name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-tests:
    name: Swift · macOS 15 arm64 · Xcode 16.4
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Verify Apple Silicon test host
        run: |
          test "$(uname -m)" = "arm64"
          case "$(sw_vers -productVersion)" in
            15.*) ;;
            *) echo "Expected macOS 15, found $(sw_vers -productVersion)" >&2; exit 1 ;;
          esac
      - name: Select Xcode 16.4
        run: |
          test -d /Applications/Xcode_16.4.app
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version | grep -Fx 'Xcode 16.4'
      - name: Run app and core tests
        run: ./scripts/test.sh
      - name: Run manifest tool tests
        run: swift test --package-path Tools/ManifestTool

  constrained-memory-policy:
    name: Real 8 GB-class policy lane
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Verify physical constrained-memory host
        run: |
          test "$(uname -m)" = "arm64"
          memory_bytes="$(sysctl -n hw.memsize)"
          maximum_bytes=$((8 * 1024 * 1024 * 1024))
          echo "Physical unified memory: $memory_bytes bytes"
          if [ "$memory_bytes" -gt "$maximum_bytes" ]; then
            echo "This lane requires a physical 8 GB-class runner; it does not simulate a memory cap." >&2
            exit 1
          fi
      - name: Select Xcode 16.4
        run: |
          test -d /Applications/Xcode_16.4.app
          sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Test constrained run planning
        run: |
          swift test --filter RunPlanResolverTests

  native-msplat:
    name: Native Metal trainer
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Select Xcode 16.4
        run: |
          test "$(uname -m)" = "arm64"
          test -d /Applications/Xcode_16.4.app
          sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Install native validation dependencies
        env:
          RIPGREP_VERSION: "15.2.0"
          RIPGREP_SHA256: "3750b2e93f37e0c692657da574d7019a101c0084da05a790c83fd335bad973e4"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ripgrep.tar.gz"
          ripgrep_root="$RUNNER_TEMP/ripgrep-$RIPGREP_VERSION-aarch64-apple-darwin"
          /usr/bin/curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/ripgrep-${RIPGREP_VERSION}-aarch64-apple-darwin.tar.gz"
          echo "$RIPGREP_SHA256  $archive" | /usr/bin/shasum -a 256 -c -
          /usr/bin/tar -xzf "$archive" -C "$RUNNER_TEMP" \
            "ripgrep-${RIPGREP_VERSION}-aarch64-apple-darwin/rg"
          test -x "$ripgrep_root/rg"
          "$ripgrep_root/rg" --version
          printf '%s\n' "$ripgrep_root" >> "$GITHUB_PATH"
          python -m pip install --disable-pip-version-check --no-input \
            --require-hashes --requirement scripts/benchmark/requirements.txt
      - name: Build pinned native trainer
        run: ./scripts/toolchain/build_msplat.sh
      - name: Validate native trainer and release integration
        run: |
          ./scripts/ci/test_msplat_native_build.sh
          ./scripts/ci/test_release_scripts.sh

  repo-health:
    name: Repository contracts
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Select Xcode 16.4
        run: |
          test "$(uname -m)" = "arm64"
          test -d /Applications/Xcode_16.4.app
          sudo xcode-select -s /Applications/Xcode_16.4.app
      - name: Install repository check dependencies
        env:
          RIPGREP_VERSION: "15.2.0"
          RIPGREP_SHA256: "3750b2e93f37e0c692657da574d7019a101c0084da05a790c83fd335bad973e4"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ripgrep.tar.gz"
          ripgrep_root="$RUNNER_TEMP/ripgrep-$RIPGREP_VERSION-aarch64-apple-darwin"
          /usr/bin/curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "$archive" \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RIPGREP_VERSION}/ripgrep-${RIPGREP_VERSION}-aarch64-apple-darwin.tar.gz"
          echo "$RIPGREP_SHA256  $archive" | /usr/bin/shasum -a 256 -c -
          /usr/bin/tar -xzf "$archive" -C "$RUNNER_TEMP" \
            "ripgrep-${RIPGREP_VERSION}-aarch64-apple-darwin/rg"
          test -x "$ripgrep_root/rg"
          "$ripgrep_root/rg" --version
          printf '%s\n' "$ripgrep_root" >> "$GITHUB_PATH"
          python -m pip install --disable-pip-version-check --no-input \
            --require-hashes --requirement scripts/benchmark/requirements.txt
      - name: Verify public repository collateral
        run: ./scripts/ci/check_repo_health.sh
      - name: Verify workflow contracts
        run: ./scripts/ci/check_workflows.sh
      - name: Check shell syntax
        run: git ls-files -z 'scripts/*.sh' 'scripts/**/*.sh' | xargs -0 -r -n1 bash -n
  python-tools:
    name: DA3 bridge · Python 3.12
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Tools/Da3Sfm/requirements.txt
      - name: Install minimal bridge test dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-input \
            numpy==2.3.5 pillow==12.3.0 setuptools==83.0.0 \
            torch==2.13.0 torchvision==0.28.0
      - name: Run Python bridge tests
        run: ./scripts/test_python_tools.sh
