name: Toolchain Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Toolchain version (semver)"
        required: true
        type: string
  push:
    tags:
      - "toolchain-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          semver_re='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$INPUT_VERSION"
            TAG="toolchain-v${VERSION}"
          else
            case "$REF_NAME" in
              toolchain-v*) ;;
              *)
                echo "Expected toolchain tag to start with toolchain-v, got: $REF_NAME" >&2
                exit 1
                ;;
            esac
            TAG="$REF_NAME"
            VERSION="${TAG#toolchain-v}"
          fi
          if ! [[ "$VERSION" =~ $semver_re ]]; then
            echo "Invalid semantic version: $VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          brew install cmake ninja boost eigen freeimage glog gflags suitesparse ceres-solver qt glew cgal libomp openimageio

      - name: Build COLMAP
        run: scripts/toolchain/build_colmap.sh

      - name: Build OpenSSL
        run: scripts/toolchain/build_openssl.sh

      - name: Build Brush
        run: scripts/toolchain/build_brush.sh

      - name: Build msplat
        run: scripts/toolchain/build_msplat.sh

      - name: Build DA3-MPS bundle
        run: |
          case "${EASYSPLAT_ALLOW_UNPINNED_DA3_SOURCE:-0}" in
            ""|0|false|FALSE|no|NO|off|OFF) ;;
            *)
              echo "Toolchain release workflow refuses EASYSPLAT_ALLOW_UNPINNED_DA3_SOURCE; DA3 source must have pinned git provenance." >&2
              exit 1
              ;;
          esac
          scripts/toolchain/build_da3_mps.sh

      - name: Build MapAnything-MPS bundle
        run: scripts/toolchain/build_mapanything_mps.sh

      - name: Build VGGT-MPS bundle
        run: scripts/toolchain/build_vggt_mps.sh

      - name: Build FastVGGT-MPS bundle
        run: scripts/toolchain/build_fastvggt_mps.sh

      - name: Package toolchain
        run: scripts/toolchain/package_toolchain.sh --version "$VERSION"

      - name: Generate manifest
        env:
          REPOSITORY: ${{ github.repository }}
          TOOLCHAIN_SIGNING_KEY_BASE64: ${{ secrets.TOOLCHAIN_SIGNING_KEY_BASE64 }}
        run: |
          if [ -z "$TOOLCHAIN_SIGNING_KEY_BASE64" ]; then
            echo "Missing TOOLCHAIN_SIGNING_KEY_BASE64 secret"
            exit 1
          fi
          CORE_ZIP="Toolchains/out/toolchain-macos-arm64-$VERSION-core.zip"
          MODELS_ZIP="Toolchains/out/toolchain-macos-arm64-$VERSION-models.zip"
          CORE_URL="https://github.com/$REPOSITORY/releases/download/$TAG/toolchain-macos-arm64-$VERSION-core.zip"
          MODELS_URL="https://github.com/$REPOSITORY/releases/download/$TAG/toolchain-macos-arm64-$VERSION-models.zip"
          PRIVATE_KEY_FILE="$(mktemp)"
          trap 'rm -f "$PRIVATE_KEY_FILE"' EXIT
          printf '%s' "$TOOLCHAIN_SIGNING_KEY_BASE64" > "$PRIVATE_KEY_FILE"
          chmod 600 "$PRIVATE_KEY_FILE"
          swift run --package-path Tools/ManifestTool ManifestTool \
            --core-zip "$CORE_ZIP" \
            --core-url "$CORE_URL" \
            --models-zip "$MODELS_ZIP" \
            --models-url "$MODELS_URL" \
            --version "$VERSION" \
            --published-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --private-key-file "$PRIVATE_KEY_FILE" \
            --manifest-out "Toolchains/out/manifest.json"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          files: |
            Toolchains/out/toolchain-macos-arm64-${{ env.VERSION }}-core.zip
            Toolchains/out/toolchain-macos-arm64-${{ env.VERSION }}-models.zip
            Toolchains/out/manifest.json
