name: Bug report
description: Report a reproducible problem in the app, toolchain flow, docs, or build/release automation.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not upload client or private media, project notes, unredacted diagnostics, home or removable-volume paths, or credential-bearing URLs or tokens. Review and redact diagnostics before posting. Attach samples only when they are intentionally public and you have the right to permit redistribution.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include exact steps, a non-sensitive description of the input, and relevant configuration names. Never paste secret values.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: macOS version, Apple Silicon model, Xcode version, and how you ran EasySplat.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Paste the smallest relevant redacted log excerpt or attach a redacted screenshot.
