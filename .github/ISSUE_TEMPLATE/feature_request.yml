name: Feature request
description: Suggest a user-facing or contributor-facing improvement.
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Do not upload client or private media, project notes, unredacted diagnostics, home or removable-volume paths, or credential-bearing URLs or tokens. Review and redact diagnostics before posting. Attach samples only when they are intentionally public and you have the right to permit redistribution.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow or pain point are you trying to improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the expected behavior or API.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds exist today?
